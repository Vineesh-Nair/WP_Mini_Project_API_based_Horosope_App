<!DOCTYPE html>
<html>
<head>
<title>AI Astrology App</title>

<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#0f172a,#4c1d95);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
transition:0.3s;
}

.light{
background:linear-gradient(#f1f5f9,#c7d2fe);
color:black;
}

.card{
background:#1e293b;
padding:30px;
border-radius:20px;
width:350px;
box-shadow:0 10px 30px rgba(0,0,0,0.5);
text-align:center;
}

.light .card{
background:white;
}

input,select,button{
width:90%;
padding:12px;
margin:8px;
border-radius:10px;
border:none;
}

button{
background:#6366f1;
color:white;
cursor:pointer;
}

#result{
margin-top:20px;
text-align:left;
padding:10px;
border-radius:10px;
}

.toggle{
margin-bottom:10px;
}
</style>

</head>

<body>

<div class="card">

<button class="toggle" onclick="toggleMode()">🌙 Toggle Mode</button>

<h1 id="greet">🔮 Astrology App</h1>

<input id="name" placeholder="Enter Name">
<input type="date" id="dob">

<select id="type">
<option value="general">General</option>
<option value="love">Love ❤️</option>
<option value="career">Career 💼</option>
<option value="health">Health 🧘</option>
</select>

<button onclick="getHoroscope()">Get Horoscope</button>

<div id="result"></div>

</div>

<script>

// 🌙 Dark/Light Mode
function toggleMode(){
document.body.classList.toggle("light");
}

// ⏰ Greeting
let hour=new Date().getHours();
let greet=document.getElementById("greet");

if(hour<12) greet.innerText="🌅 Good Morning - Astrology App";
else if(hour<18) greet.innerText="☀️ Good Afternoon - Astrology App";
else greet.innerText="🌙 Good Evening - Astrology App";

// Zodiac Logic
function getZodiac(d,m){
if((m==3&&d>=21)||(m==4&&d<=19)) return "Aries ♈";
if((m==4&&d>=20)||(m==5&&d<=20)) return "Taurus ♉";
if((m==5&&d>=21)||(m==6&&d<=20)) return "Gemini ♊";
if((m==6&&d>=21)||(m==7&&d<=22)) return "Cancer ♋";
if((m==7&&d>=23)||(m==8&&d<=22)) return "Leo ♌";
if((m==8&&d>=23)||(m==9&&d<=22)) return "Virgo ♍";
if((m==9&&d>=23)||(m==10&&d<=22)) return "Libra ♎";
if((m==10&&d>=23)||(m==11&&d<=21)) return "Scorpio ♏";
if((m==11&&d>=22)||(m==12&&d<=21)) return "Sagittarius ♐";
if((m==12&&d>=22)||(m==1&&d<=19)) return "Capricorn ♑";
if((m==1&&d>=20)||(m==2&&d<=18)) return "Aquarius ♒";
return "Pisces ♓";
}

// 🎲 Random extras
function randomItem(arr){
return arr[Math.floor(Math.random()*arr.length)];
}

// 🚀 Main Function
async function getHoroscope(){

let name=document.getElementById("name").value;
let dob=document.getElementById("dob").value;
let type=document.getElementById("type").value;

if(name==""||dob==""){
alert("Fill all details");
return;
}

let date=new Date(dob);
let sign=getZodiac(date.getDate(),date.getMonth()+1);

document.getElementById("result").innerHTML="⏳ Loading...";

// API call
let res=await fetch("http://localhost:5000/horoscope",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({name,sign,type})
});

let data=await res.json();

// 🎲 Extra features
let luckyNumbers=[1,3,7,9,11];
let colors=["Red 🔴","Blue 🔵","Green 🟢","Purple 🟣","Yellow 🟡"];

let resultHTML=`
<b>Hello ${name}</b><br>
<b>Zodiac:</b> ${sign}<br><br>
${data.text}<br><br>
<b>Lucky Number:</b> ${randomItem(luckyNumbers)}<br>
<b>Lucky Color:</b> ${randomItem(colors)}
`;

document.getElementById("result").innerHTML=resultHTML;

// 💾 Save last result
localStorage.setItem("lastResult",resultHTML);
}

// Load last result on refresh
window.onload=function(){
let last=localStorage.getItem("lastResult");
if(last){
document.getElementById("result").innerHTML=last;
}
}

</script>

</body>
</html>
